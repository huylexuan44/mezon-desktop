name: Build

on:
  push:
    branches:
      - develop
      - test/**
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      NX_CHAT_APP_API_HOST: api.mezon.ai
      NX_CHAT_APP_API_PORT: "443"
      NX_CHAT_APP_API_SECURE: "true"
      NX_CHAT_APP_API_KEY: ${{ secrets.NX_CHAT_APP_API_KEY }}
      NX_CHAT_APP_API_GW_HOST: gw.mezon.ai
      NX_CHAT_APP_API_GW_PORT: "443"
      NX_CHAT_APP_STREAM_WS_URL: wss://stn.mezon.ai
      NX_CHAT_APP_MEET_WS_URL: wss://meet.mezon.ai
      NX_CHAT_APP_NOTIFICATION_WS_URL: wss://gotify.mezon.ai
      NX_CHAT_APP_OAUTH2_AUTHORIZE_URL: https://oauth2.mezon.ai/oauth2/auth
      NX_CHAT_APP_OAUTH2_CLIENT_ID: 25f63a1f-16b8-488b-8b14-68520eeab77f
      NX_CHAT_APP_OAUTH2_REDIRECT_URI: http://127.0.0.1:4200/login/callback
      NX_CHAT_APP_OAUTH2_RESPONSE_TYPE: code
      NX_CHAT_APP_OAUTH2_SCOPE: openid+offline
      NX_CHAT_APP_OAUTH2_CODE_CHALLENGE_METHOD: S256
      NX_CHAT_APP_OAUTH2_LOG_OUT: https://oauth2.mezon.ai/oauth2/sessions/logout
      NX_CHAT_APP_OAUTH2_LOG_OUT_CALLBACK: https://mezon.ai/logout/callback
      NX_CHAT_APP_GOOGLE_CLIENT_ID: 391688022389-1k9kb377ea6dccpqii7m5pifjj0agsjc.apps.googleusercontent.com
      NX_DOMAIN_URL: https://mezon.ai
      NX_CHAT_APP_REDIRECT_URI: https://mezon.ai
      NX_LOGO_MEZON: https://cdn.mezon.ai/images/mezon_logo.png
      NX_BASE_IMG_URL: https://cdn.mezon.ai
      NX_PROFILE_IMG_URL: https://profile.mezon.ai
      NX_IMGPROXY_BASE_URL: https://imgproxy.mezon.ai
      NX_IMGPROXY_KEY: ${{ secrets.NX_IMGPROXY_KEY }}
      NX_CHAT_APP_API_TENOR_KEY: ${{ secrets.NX_CHAT_APP_API_TENOR_KEY }}
      NX_CHAT_APP_API_TENOR_URL_CATEGORIES: https://tenor.googleapis.com/v2/categories?key=
      NX_CHAT_APP_API_TENOR_URL_SEARCH: https://tenor.googleapis.com/v2/search?q=
      NX_CHAT_APP_API_TENOR_URL_FEATURED: https://tenor.googleapis.com/v2/featured?key=
      NX_CHAT_APP_MEZON_TREASURY_URL: https://withdraw-api.nccsoft.vn
      NX_CHAT_APP_API_MEZONTREASURY_KEY: ${{ secrets.NX_CHAT_APP_API_MEZONTREASURY_KEY }}
      NX_CHAT_APP_CONTRACT_ADDRESS: "0x4F17a94dD6E1B2D6241C4D1956C6c7a07ba2Ec50"
      NX_CHAT_APP_MEZON_TREASURY_URL_NETWORK: https://sepolia.etherscan.io
      NX_WEBRTC_ICESERVERS_URL: turn:relay.mezon.ai:5349
      NX_WEBRTC_ICESERVERS_USERNAME: turnmezon
      NX_WEBRTC_ICESERVERS_CREDENTIAL: ${{ secrets.NX_WEBRTC_ICESERVERS_CREDENTIAL }}
      NX_CHAT_APP_FCM_API_KEY: ${{ secrets.NX_CHAT_APP_FCM_API_KEY }}
      NX_CHAT_APP_FCM_AUTH_DOMAIN: mezon-772fa.firebaseapp.com
      NX_CHAT_APP_FCM_PROJECT_ID: mezon-772fa
      NX_CHAT_APP_FCM_STORAGE_BUCKET: mezon-772fa.appspot.com
      NX_CHAT_APP_FCM_MESSAGING_SENDER_ID: "285548761692"
      NX_CHAT_APP_FCM_APP_ID: "1:285548761692:web:3ca531af1deecee74e0c99"
      NX_CHAT_APP_FCM_MEASUREMENT_ID: G-0WNQTXVMT3
      NX_CHAT_APP_FCM_VAPID_KEY: ${{ secrets.NX_CHAT_APP_FCM_VAPID_KEY }}
      NX_CHAT_APP_API_CLIENT_KEY_CUSTOM: mezon.ai
      NX_CHAT_SENTRY_DSN: ${{ secrets.NX_CHAT_SENTRY_DSN }}
      NX_CHAT_APP_ANNONYMOUS_USER_ID: "1767478432163172999"
      NX_MAX_LENGTH_NAME_ALLOWED: "64"
      NX_UPDATE_URL: https://cdn.mezon.ai/release/
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact_name: mezon-linux-x86_64
          - os: windows-latest
            name: Windows
            artifact_name: mezon-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps

      - name: Build release binary
        run: cargo build --release -p mezon-app --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p mezon-app --locked

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/mezon
            target/debian/*.deb
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/mezon.exe
          if-no-files-found: error
